<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Panel LYBOX</title>

  <link rel="stylesheet" href="./admin.css">
</head>

<body>

  <div class="container">

    <h1>Panel de Administración LYBOX</h1>

    <div class="toolbar">

      <button id="btnNuevo">
        + Nuevo producto
      </button>

      <button id="publicarGitHub">
        🚀 Publicar catálogo
      </button>

    </div>


    <table>

      <thead>

        <tr>
          <th>SKU</th>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>

      </thead>

      <tbody id="tablaProductos"></tbody>

    </table>

  </div>


  <!-- ========================================= -->
  <!-- MODAL PRODUCTO -->
  <!-- ========================================= -->

  <div id="modal" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">

        <h2>Producto</h2>

        <button
          id="cerrarModal"
          type="button">
          ✕
        </button>

      </div>


      <form id="formProducto">

        <div class="grid">


          <!-- SKU -->

          <div>

            <label for="sku">
              SKU
            </label>

            <input
              id="sku"
              required>

          </div>


          <!-- MARCA -->

          <div>

            <label for="brand">
              Marca
            </label>

            <input id="brand">

          </div>


          <!-- NOMBRE -->

          <div class="full">

            <label for="name">
              Nombre
            </label>

            <input
              id="name"
              required>

          </div>


          <!-- CATEGORÍA -->

          <div>

            <label for="category">
              Categoría
            </label>

            <select id="category">

              <option value="polos">
                Polos
              </option>

              <option value="shorts">
                Shorts
              </option>

              <option value="guantes">
                Guantes
              </option>

              <option value="vendas">
                Vendas
              </option>

              <option value="sacos">
                Sacos
              </option>

            </select>

          </div>


          <!-- PRECIO -->

          <div>

            <label for="price">
              Precio
            </label>

            <input
              id="price"
              type="number"
              min="0"
              step="0.01"
              required>

          </div>


          <!-- STOCK -->

          <div>

            <label for="stock">
              Stock
            </label>

            <select id="stock">

              <option value="available">
                Disponible
              </option>

              <option value="low">
                Poco stock
              </option>

              <option value="soldout">
                Agotado
              </option>

            </select>

          </div>


          <!-- ===================================== -->
          <!-- IMÁGENES -->
          <!-- ===================================== -->

          <div class="full">

            <label>
              Imágenes
            </label>


            <div
              id="dropZone"
              class="drop-zone">


              <input
                id="imageFile"
                type="file"
                accept="image/*"
                multiple
                hidden>


              <div id="dropContent">

                <strong>
                  📷 Arrastra imágenes aquí
                </strong>

                <p>
                  o haz clic para seleccionar
                </p>

              </div>


              <img
                id="preview"
                class="preview hidden"
                alt="Vista previa">


            </div>


            <input
              id="image"
              type="hidden">


            <small
              id="imageName">
            </small>

          </div>


          <!-- DESCRIPCIÓN -->

          <div class="full">

            <label for="description">
              Descripción
            </label>

            <textarea
              id="description"></textarea>

          </div>


          <!-- TALLAS -->

          <div>

            <label for="sizes">
              Tallas (coma)
            </label>

            <input
              id="sizes"
              placeholder="S,M,L">

          </div>


          <!-- COLORES -->

          <div>

            <label for="colors">
              Colores (coma)
            </label>

            <input
              id="colors"
              placeholder="Negro,Rojo">

          </div>


          <!-- CARACTERÍSTICAS -->

          <div class="full">

            <label for="features">
              Características (una por línea)
            </label>

            <textarea
              id="features"></textarea>

          </div>


        </div>


        <!-- GUARDAR -->

        <button
          type="submit">

          Guardar producto

        </button>


      </form>

    </div>

  </div>


  <script src="./admin.js"></script>

</body>

</html>
