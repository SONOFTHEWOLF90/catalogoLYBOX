<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel LYBOX</title>
  <link rel="stylesheet" href="./admin.css">
</head>

<body>

<div class="container">

  <h1>Panel de Administración LYBOX</h1>

  <div class="toolbar">
    <button id="btnNuevo">+ Nuevo producto</button>
    <button id="publicarGitHub">🚀 Publicar catálogo</button>

  <table>
    <thead>
      <tr>
        <th>SKU</th>
        <th>Producto</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody id="tablaProductos"></tbody>

  </table>

</div>

<div id="modal" class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">
      <h2>Producto</h2>
      <button id="cerrarModal">✕</button>
    </div>

    <form id="formProducto">

      <div class="grid">

        <div>
          <label>SKU</label>
          <input id="sku" required>
        </div>

        <div>
          <label>Marca</label>
          <input id="brand">
        </div>

        <div class="full">
          <label>Nombre</label>
          <input id="name" required>
        </div>

        <div>
          <label>Categoría</label>

          <select id="category">

            <option value="guantes">Guantes</option>
            <option value="vendas">Vendas</option>
            <option value="cascos">Cascos</option>
            <option value="protectores">Protectores</option>
            <option value="sacos">Sacos</option>
            <option value="ropa">Ropa</option>
            <option value="accesorios">Accesorios</option>
            <option value="mma">MMA</option>

          </select>

        </div>

        <div>
          <label>Precio</label>
          <input id="price" type="number" required>
        </div>

        <div>
          <label>Stock</label>

          <select id="stock">

            <option value="available">Disponible</option>
            <option value="low">Poco stock</option>
            <option value="soldout">Agotado</option>

          </select>

        </div>

         <div class="full">
          <label>Imagen</label>

          <div id="dropZone" class="drop-zone">
            <input id="imageFile" type="file" accept="image/*" hidden>
            <div id="dropContent">
              <strong>📷 Arrastra una imagen aquí</strong>
              <p>o haz clic para seleccionar</p>
            </div>

            <img id="preview" class="preview hidden" alt="Vista previa">
          </div>

          <input id="image" type="hidden">
          <small id="imageName"></small>

        </div>        


        <div class="full">
          <label>Descripción</label>
          <textarea id="description"></textarea>
        </div>

        <div>
          <label>Tallas (coma)</label>
          <input id="sizes" placeholder="10 oz,12 oz">
        </div>

        <div>
          <label>Colores (coma)</label>
          <input id="colors" placeholder="Negro,Rojo">
        </div>

        <div class="full">
          <label>Características (una por línea)</label>
          <textarea id="features"></textarea>
        </div>

      </div>

      <button type="submit">Guardar producto</button>

    </form>

  </div>

</div>

<script src="./admin.js"></script>

</body>
</html>
